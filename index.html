<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A personal blog.">
    <title>Blog</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="hero" aria-label="Blog introduction">
      <div class="parallax" aria-hidden="true">
        <div class="parallax-layer layer6"></div>
        <div class="parallax-layer layer5"></div>
        <div class="parallax-layer layer4"></div>
        <div class="parallax-layer layer3"></div>
        <div class="parallax-layer layer2"></div>
        <div class="parallax-layer layer1"></div>
        <div class="parallax-layer layer0"></div>
        <div class="parallax-layer layer-title"></div>
      </div>
      <a class="skip-link" href="#posts">Read posts</a>
    </header>

    <main id="posts" class="posts" tabindex="-1">
      <h1>Posts</h1>
      <article class="post">
        <h2>A special post</h2>
        <div class="video-embed">
          <iframe
            src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ"
            title="Rick Astley — Never Gonna Give You Up"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        </div>
      </article>
      <!-- Add posts here by copying the article structure below.
      <article class="post">
        <h2>Post title</h2>
        <p>Your post text.</p>
      </article>
      -->
      <p class="empty-state">Posts are coming soon.</p>
    </main>
  </body>
</html>
